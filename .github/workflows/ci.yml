# Reusable CI of nullkomma projects, called by their generated push.yml.
name: nullkomma CI
on:
  workflow_call:
    inputs:
      visibility:
        description: FlakeHub visibility (public, unlisted or private); empty skips publishing.
        type: string
        default: ""
      deploy:
        description: Run `nix run .#deploy` on pushes to the default branch.
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
jobs:
  DeterminateCI:
    uses: DeterminateSystems/ci/.github/workflows/workflow.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      visibility: ${{ inputs.visibility }}
      fail-fast: false
      runner-map: |
        {
          "aarch64-darwin": "macos-latest",
          "aarch64-linux": "ubuntu-24.04-arm",
          "x86_64-linux": "ubuntu-latest"
        }
  flake-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/flake-checker-action@v14
        with:
          fail-mode: true
  deploy:
    if: inputs.deploy && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: DeterminateCI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - run: nix run .#deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
