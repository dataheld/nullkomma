# Reusable CI of nullkomma projects, called by their push.yml.
name: nullkomma CI
on:
  workflow_call:
    inputs:
      visibility:
        description: FlakeHub visibility (public, unlisted or private); empty skips publishing.
        type: string
        default: ""
jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      matrix: ${{ steps.systems.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Discover supported systems
        id: systems
        run: |
          matrix=$(nix eval --json .#devShells --apply '
            shells: {
              include = builtins.map (system: {
                inherit system;
                runner = builtins.getAttr system {
                  aarch64-darwin = "macos-latest";
                  aarch64-linux = "ubuntu-24.04-arm";
                  x86_64-linux = "ubuntu-latest";
                };
              }) (builtins.attrNames shells);
            }')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build:
    needs: inventory
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - name: Check flake
        run: nix flake check --print-build-logs
      - name: Build packages and development shells
        env:
          NIX_SYSTEM: ${{ matrix.system }}
        run: |
          for output in packages devShells; do
            names=$(nix eval --json ".#$output.$NIX_SYSTEM" --apply builtins.attrNames)
            targets=()
            while IFS= read -r name; do
              if [[ -n "$name" ]]; then
                targets+=(".#$output.$NIX_SYSTEM.\"$name\"")
              fi
            done <<< "$(jq -r '.[]' <<< "$names")"
            if (( ${#targets[@]} )); then
              nix build --no-link --print-build-logs "${targets[@]}"
            fi
          done
  success:
    needs: [inventory, build, flake-checker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
  publish:
    needs: success
    if: >-
      ${{ !github.event.repository.fork && inputs.visibility != '' && github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/flakehub-cache-action@v3
      - uses: DeterminateSystems/flakehub-push@v7
        with:
          rolling: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          visibility: ${{ inputs.visibility }}
          include-output-paths: true
  flake-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/flake-checker-action@v14
        with:
          fail-mode: true
