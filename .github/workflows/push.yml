name: CI
on:
  pull_request:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  nullkomma:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      id-token: write
    with:
      visibility: "public"
