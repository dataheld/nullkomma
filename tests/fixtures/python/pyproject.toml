[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]

[project]
name = "nk_example"
version = "0.1.0"
description = "Python consumer contract fixture"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["click>=8"]

[project.scripts]
nk-example = "nk_example:main"

[tool.uv]
default-groups = ["dev"]
